
version: 2

models:
  - name: redcards_structured
    description: "Test on dupes of the primary key"
    columns:
      - name: PLAYERNAME
        description: "The name of each player"
        tests:
          - unique
          - not_null
      - name: YELLOW
        description: "Number of yellow cards amassed by each player"
        tests:
          - dbt_expectations.expect_column_to_exist
          - not_null
      - name: RED
        description: "Number of yellow cards amassed by each player"
        tests:
          - dbt_expectations.expect_column_to_exist
          - not_null     
      - name: TEAMNAME
        description: "Number of yellow cards amassed by each player"
        tests:
          - dbt_expectations.expect_column_to_exist
          - not_null          

